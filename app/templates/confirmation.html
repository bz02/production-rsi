{% extends "base.html" %}
{% block title %}Order confirmed{% endblock %}
{% block body %}
<section class="panel done">
  <div class="tick" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Order confirmed</h1>
  <p class="lede">Order {{ order }} is on its way. We have emailed the receipt.</p>
  <a class="btn btn-ghost" data-testid="primary-action" href="/">Back to the shop</a>
</section>
{% endblock %}
